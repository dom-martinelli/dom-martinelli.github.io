name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# a second push while a run is in flight cancels the first: the only result
# anyone acts on is the one for the current tip
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cheap layer first. These are file and JSON questions, they take under a
  # second, and they catch the failures that are most likely: a content field
  # with the wrong type, a link written in the wrong directory frame, HTML that
  # no longer matches the JSON it was generated from. Running them before the
  # browser job means an obvious mistake fails in ~20 seconds instead of two
  # minutes, and the error names a file rather than a selector.
  contract:
    name: contract checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - name: content and generator contract
        run: python -m pytest checks -q
        working-directory: tests

      # The same question asked the way a reviewer would: rebuild and see if the
      # tree moved. pytest already proves it in a temp copy; this one also fails
      # loudly in the diff, which is what a human reads on a PR.
      - name: committed HTML matches a fresh build
        run: |
          python3 build.py
          if ! git diff --quiet; then
            echo "::error::generated HTML is stale. run 'python3 build.py' and commit the result."
            git diff --stat
            git diff | head -200
            exit 1
          fi
          echo "generated HTML is in sync with content/*.json"

  e2e:
    name: browser tests
    needs: contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - run: npm ci
        working-directory: tests
      # --with-deps installs the system libraries the browsers need on a clean
      # ubuntu runner; without it chromium starts and immediately dies
      - run: npx playwright install --with-deps chromium webkit
        working-directory: tests
      - name: playwright
        run: npx playwright test
        working-directory: tests

      # the report is the point of a failing run: traces, screenshots, and the
      # DOM at the moment of failure, so a red build is debuggable without
      # reproducing it locally
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: tests/playwright-report/
          retention-days: 14
